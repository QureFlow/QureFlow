services:
  mysql:
    image: mysql:8.4
    command: --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: qureflow_local_root_only
      MYSQL_DATABASE: qureflow_dbms
      MYSQL_USER: qureflow
      MYSQL_PASSWORD: qureflow_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - qureflow-mysql-demo:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqureflow", "-pqureflow_local_only"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  qureflow-mysql-demo:
